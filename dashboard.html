<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Canopy</title>
<style>
  :root {
    --bg: #0c0f0c; --surface: #151a15; --surface-2: #1c231c;
    --fg: #e8eee6; --muted: #8a9386; --subtle: #5e675b;
    --primary: #9cba8b; --primary-fg: #0c0f0c;
    --warn: #c4a574; --alert: #c47a6a; --ok: #8fba8a;
    --side: clamp(16rem, 34vw, 26rem);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  body.kiosk { overflow: hidden; }
  .stage {
    display: flex; flex-direction: column;
    width: 100%; height: 100dvh; min-height: 100%;
    background: var(--bg);
  }
  header {
    height: clamp(2rem, 6vh, 3rem);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1rem 0 1.1rem; background: var(--surface); flex-shrink: 0;
  }
  header .brand { font-family: Georgia, "Times New Roman", serif; font-size: clamp(14px, 2.4vh, 20px); margin: 0; }
  header .hint { font-size: 12px; color: var(--subtle); margin: 0 12px 0 auto; }
  header .meta {
    display: flex; align-items: baseline; gap: 12px; margin-left: auto; flex-shrink: 0;
  }
  header .cpu {
    font-family: ui-monospace, monospace;
    font-size: clamp(11px, 1.8vh, 14px);
    color: var(--muted); margin: 0; letter-spacing: .02em; white-space: nowrap;
  }
  header .clock { font-family: ui-monospace, monospace; font-size: clamp(12px, 2vh, 16px); color: var(--muted); margin: 0; }
  .body { display: flex; flex: 1; min-height: 0; }
  .cam { position: relative; flex: 1; min-width: 0; background: var(--surface-2); display: none !important; }
  body.full .cam { display: block !important; }
  .cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam .scrim {
    pointer-events: none; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(12,15,12,.72), transparent 42%);
  }
  .badge {
    position: absolute; top: clamp(8px, 1.4vh, 14px); left: clamp(8px, 1.4vh, 14px);
    display: flex; align-items: center; gap: 6px;
    background: rgba(12,15,12,.7); color: var(--fg);
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 6px;
  }
  .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--muted); }
  .dot.live { background: var(--alert); }
  .flag {
    position: absolute; top: clamp(8px, 1.4vh, 14px); right: clamp(8px, 1.4vh, 14px);
    font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px;
  }
  .flag.pulse { background: var(--primary); color: var(--primary-fg); }
  .flag.lamp { background: var(--warn); color: #1a140c; }
  .plant {
    position: absolute; left: clamp(8px, 1.6vh, 16px); bottom: clamp(8px, 1.6vh, 16px);
    font-family: Georgia, serif; font-size: clamp(18px, 3.4vh, 32px); margin: 0; line-height: 1.15;
  }
  aside {
    width: var(--side); flex-shrink: 0; background: var(--surface);
    display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 16px);
    padding: clamp(10px, 2vh, 20px) clamp(12px, 1.6vw, 20px);
  }
  .k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .status { font-family: Georgia, serif; font-size: clamp(18px, 3.6vh, 36px); line-height: 1.15; margin: 0; }
  .status.ok { color: var(--ok); }
  .status.warn { color: var(--warn); }
  .status.alert { color: var(--alert); }
  .sub { font-size: clamp(12px, 1.8vh, 15px); color: var(--muted); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter .row { display: flex; justify-content: space-between; gap: 8px; font-size: clamp(11px, 1.7vh, 14px); }
  .meter .lab { letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .meter .val { font-family: ui-monospace, monospace; }
  .meter .val.warn { color: var(--warn); }
  .bar { position: relative; height: clamp(4px, 0.7vh, 8px); border-radius: 99px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
  .bar.warn > i { background: var(--warn); }
  .bar .m { position: absolute; top: 0; width: 1px; height: 100%; background: rgba(232,238,230,.4); }
  .actions { margin-top: auto; display: flex; flex-direction: column; gap: 10px; width: 100%; }
  body.kiosk .controls { display: none !important; }
  body.kiosk header .hint { display: none; }
  .controls { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  button {
    width: 100%;
    min-height: 48px; border: 0; border-radius: 999px; cursor: pointer;
    font: 500 16px "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  button svg { width: 20px; height: 20px; flex-shrink: 0; }
  button:disabled { opacity: .4; cursor: default; }
  .go { background: var(--primary); color: var(--primary-fg); }
  .ghost {
    background: transparent; color: var(--fg);
    box-shadow: 0 0 0 1px rgba(232,238,230,.14);
  }
  .next { text-align: center; font-family: ui-monospace, monospace; font-size: clamp(11px, 1.8vh, 14px); color: var(--muted); margin: 0; }
  .raw { text-align: center; font-family: ui-monospace, monospace; font-size: 11px; color: var(--subtle); margin: 0; word-break: break-word; }
  .cal { display: flex; flex-direction: row; gap: 8px; width: 100%; }
  .cal button, .plants button {
    flex: 1; width: auto; min-width: 0; min-height: 44px; font-size: 12px; border-radius: 999px;
    background: transparent; color: var(--muted);
    box-shadow: 0 0 0 1px rgba(232,238,230,.12);
  }
  .plants {
    display: flex; flex-direction: row; gap: 8px; width: 100%;
  }
  .plants button.on {
    background: var(--primary); color: var(--primary-fg);
    box-shadow: none;
  }
  .band {
    text-align: center; font-family: ui-monospace, monospace;
    font-size: 11px; color: var(--muted); margin: 0;
  }
  .meter-link { color: inherit; text-decoration: none; display: block; }
  .meter-link:focus-visible { outline: 2px solid var(--primary); border-radius: 8px; }
  .light-hint {
    font-family: ui-monospace, monospace; font-size: 11px;
    color: var(--muted); margin: 4px 0 0;
  }
  body.kiosk .light-hint { display: none; }
  body.kiosk .meter-link { pointer-events: none; }
  .hdmi-charts {
    display: flex;
    flex: 1;
    min-width: 0;
    min-height: 0;
    flex-direction: column;
    gap: 6px;
    padding: 6px;
    background: var(--bg);
  }
  body.full .hdmi-charts { display: none !important; }
  .hdmi-charts section {
    flex: 1 1 0%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-radius: 10px;
    padding: 6px 10px 4px;
    box-shadow: 0 0 0 1px rgba(232,238,230,.08);
    overflow: hidden;
  }
  .hdmi-charts .hdmi-num {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(22px, 5.2vh, 36px);
    line-height: 1;
    margin: 2px 0 0;
    letter-spacing: -0.03em;
  }
  .hdmi-charts .hdmi-num span {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: clamp(12px, 2vh, 14px);
    color: var(--muted);
    margin-left: 6px;
  }
  .hdmi-charts .hdmi-why {
    font-size: clamp(12px, 2.1vh, 15px);
    margin: 4px 0 2px;
    color: var(--ok);
  }
  .hdmi-charts .hdmi-why.behind { color: var(--alert); }
  .hdmi-charts svg {
    flex: 1;
    min-height: 0;
    width: 100%;
    height: auto;
    display: block;
  }
  .power {
    min-height: 40px; font-size: 13px; color: var(--muted);
    background: transparent;
    box-shadow: 0 0 0 1px rgba(232,238,230,.12);
  }
  .power.armed {
    color: #1a100e; background: var(--alert);
    box-shadow: none;
  }
  @media (max-width: 700px) {
    body.full { overflow: auto; }
    body.full .stage { height: auto; min-height: 100dvh; }
    body.full .body { flex-direction: column; }
    body.full .cam { height: 42vh; min-height: 220px; flex: none; }
    body.full aside { width: 100%; }
    body.full header .hint { display: none; }
  }
  @media (max-height: 520px) and (min-width: 701px) {
    aside { gap: 6px; padding: 8px 12px; }
    .cal button, body.full button { min-height: 32px; }
  }
</style>
</head>
<body class="{{MODE}}">
<div class="stage">
  <header>
    <p class="brand">Canopy</p>
    <p class="hint">Controls on this page · HDMI is stats only</p>
    <div class="meta">
      <p class="cpu" id="cpu">CPU -- °C</p>
      <p class="clock" id="clock">--:--:--</p>
    </div>
  </header>
  <div class="body">
    <!--CAM-->
    <div class="cam" id="camPane">
      <img id="cam" alt="Station camera"/>
      <div class="scrim"></div>
      <div class="badge"><span class="dot"></span> <span id="snapLabel">Snapshot</span></div>
      <div class="flag pulse" id="pulse" hidden>Pulse</div>
      <div class="flag lamp" id="lampFlag" hidden>Lamp</div>
      <p class="plant" id="plant">—</p>
    </div>
    <!--/CAM-->
    <div class="hdmi-charts" id="hdmiCharts" aria-label="Station charts">
      <section>
        <p class="k">Today's light</p>
        <p class="hdmi-num" id="hdmiLightNum">—<span>sun-h</span></p>
        <p class="hdmi-why" id="hdmiLightWhy">—</p>
        <svg id="hdmiLight" viewBox="0 0 720 320" role="img" aria-label="Today's light"></svg>
      </section>
      <section>
        <p class="k">Soil moisture</p>
        <p class="hdmi-num" id="hdmiMoistNum">—<span>%</span></p>
        <p class="hdmi-why" id="hdmiMoistWhy">—</p>
        <svg id="hdmiMoist" viewBox="0 0 720 320" role="img" aria-label="7-day moisture"></svg>
      </section>
    </div>
    <aside>
      <div>
        <p class="k">Status</p>
        <p class="status ok" id="status">Waiting</p>
        <p class="sub" id="profile">—</p>
      </div>
      <a class="meter-link" href="/moisture" id="moist-link">
        <div class="meter" id="m-moist"></div>
        <p class="light-hint" id="moistHint">Soil moisture</p>
      </a>
      <a class="meter-link" href="/light" id="light-link">
        <div class="meter" id="m-light"></div>
        <p class="light-hint" id="lightHint">Today’s light</p>
      </a>
      <div class="meter" id="m-green"></div>
      <div class="meter" id="m-yellow"></div>
      <div class="actions">
        <div class="controls">
          <button class="go" id="water" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-4-7-11-7-11S5 11 5 15a7 7 0 0 0 7 7z"/></svg>
            <span>Water 1s</span>
          </button>
          <button class="ghost" id="lamp" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <span id="lampLabel">Lamp on</span>
          </button>
        </div>
        <p class="next" id="next">Auto --:--</p>
        <p class="raw" id="raw">sensors —</p>
        <div class="plants controls" id="plants">
          <button type="button" data-plant="lush">Lush</button>
          <button type="button" data-plant="standard">Standard</button>
          <button type="button" data-plant="succulent">Succulent</button>
        </div>
        <p class="band controls" id="band">Moisture 40–70%</p>
        <div class="controls">
          <button class="power" id="power" type="button">Shut down</button>
        </div>
      </div>
    </aside>
  </div>
</div>
<script>
const KIOSK = !document.body.classList.contains("full");
if (KIOSK) {
  const cam0 = document.getElementById("cam");
  if (cam0) cam0.removeAttribute("src");
}
function num(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}
function meter(el, label, value, low, high, ready) {
  if (!el) return;
  if (!ready) {
    el.innerHTML = `<div class="row"><span class="lab">${label}</span>
      <span class="val">—</span></div>
      <div class="bar"><i style="width:2%"></i></div>`;
    return;
  }
  const n = num(value);
  const lo = low == null ? null : num(low);
  const hi = high == null ? null : num(high);
  const warn = (lo != null && n < lo) || (hi != null && n > hi);
  const marks = (lo != null ? `<span class="m" style="left:${lo}%"></span>` : "")
    + (hi != null ? `<span class="m" style="left:${hi}%"></span>` : "");
  el.innerHTML = `<div class="row"><span class="lab">${label}</span>
    <span class="val ${warn ? "warn" : ""}">${n.toFixed(1)}%</span></div>
    <div class="bar ${warn ? "warn" : ""}"><i style="width:${Math.max(2, Math.min(100, n))}%"></i>${marks}</div>`;
}
function tickClock() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString();
}
const PLANTS = {
  lush: { label: "Lush houseplant", low: 45, high: 75 },
  standard: { label: "Standard houseplant", low: 40, high: 70 },
  succulent: { label: "Succulent / low-water", low: 20, high: 50 },
};
let chosenPlant = null;
function markPlant(id, low, high, label) {
  if (id && PLANTS[id]) chosenPlant = id;
  document.querySelectorAll("#plants [data-plant]").forEach((b) => {
    b.classList.toggle("on", b.getAttribute("data-plant") === chosenPlant);
  });
  const p = PLANTS[chosenPlant] || {};
  const name = label || p.label;
  if (name) {
    document.getElementById("profile").textContent = name;
    const plantEl = document.getElementById("plant");
    if (plantEl) plantEl.textContent = name;
  }
  const lo = low != null ? low : p.low;
  const hi = high != null ? high : p.high;
  const band = document.getElementById("band");
  if (band && lo != null && hi != null) {
    band.textContent = "Moisture " + lo + "–" + hi + "%";
  }
}
async function refresh() {
  try {
    const res = await fetch("/status", { cache: "no-store" });
    const s = await res.json();
    const ready = !!s.sensors_ok;
    document.getElementById("status").textContent = s.status || "Waiting";
    document.getElementById("status").className = "status " + (s.status_tone || "muted");
    const p = (s.plant_id && PLANTS[s.plant_id])
      ? PLANTS[s.plant_id]
      : (chosenPlant && PLANTS[chosenPlant]) ? PLANTS[chosenPlant] : null;
    if (s.plant_id && PLANTS[s.plant_id]) {
      markPlant(s.plant_id, s.low, s.high, s.profile);
    } else if (p) {
      markPlant(chosenPlant, p.low, p.high, p.label);
    } else {
      document.getElementById("profile").textContent = s.profile || "—";
      const plantEl = document.getElementById("plant");
      if (plantEl) plantEl.textContent = s.profile || "—";
    }
    const moistLow = p ? p.low : s.low;
    const moistHigh = p ? p.high : s.high;
    meter(document.getElementById("m-moist"), "Moisture", s.moisture, moistLow, moistHigh, ready);
    const moistHint = document.getElementById("moistHint");
    if (moistHint && moistLow != null && s.moisture != null) {
      const m = num(s.moisture);
      if (m < moistLow - 0.3) moistHint.textContent = "−" + (moistLow - m).toFixed(1) + " below target";
      else moistHint.textContent = "tap for 7-day";
    }
    meter(document.getElementById("m-light"), "Light", s.light, 40, null, ready);
    const hint = document.getElementById("lightHint");
    if (hint && s.light_delta != null) {
      const mag = Math.abs(Number(s.light_delta)).toFixed(1);
      const lampS = s.lamp ? "lamp ON" : "lamp OFF";
      if (Math.abs(Number(s.light_delta)) < 0.03) hint.textContent = "on pace · " + lampS;
      else if (s.light_delta < 0) hint.textContent = "−" + mag + " behind · " + lampS;
      else hint.textContent = "+" + mag + " ahead · " + lampS;
    }
    meter(document.getElementById("m-green"), "Green", num(s.green) * 100, null, null, true);
    meter(document.getElementById("m-yellow"), "Yellow", num(s.yellow) * 100, null, 15, true);
    const pulse = document.getElementById("pulse");
    const lampFlag = document.getElementById("lampFlag");
    if (pulse) pulse.hidden = !s.pump;
    if (lampFlag) lampFlag.hidden = !s.lamp || s.pump;
    const lampBtn = document.getElementById("lamp");
    const lampLabel = document.getElementById("lampLabel");
    if (lampBtn && lampLabel) {
      lampLabel.textContent = s.lamp ? "Lamp off" : "Lamp on";
      lampBtn.className = s.lamp ? "go" : "ghost";
    }
    const waterBtn = document.getElementById("water");
    if (waterBtn) waterBtn.disabled = !!s.pump;
    const remain = Math.max(0, Math.floor(num(s.auto_in)));
    const mm = Math.floor(remain / 60);
    const ss = String(remain % 60).padStart(2, "0");
    document.getElementById("next").textContent = "Auto " + mm + ":" + ss;
    const rawEl = document.getElementById("raw");
    if (ready) {
      let t = "raw " + s.moisture_raw + " / " + s.light_raw;
      if (s.lamp && num(s.lamp_delta)) {
        t += "  lamp " + (s.lamp_delta > 0 ? "−" : "+") + Math.abs(num(s.lamp_delta));
      }
      if (!KIOSK && chosenPlant && !s.plant_id) {
        t += "  restart station to keep plant type";
      }
      rawEl.textContent = t;
    } else if (s.last_line) {
      rawEl.textContent = "saw: " + s.last_line;
    } else if (s.serial) {
      rawEl.textContent = "Arduino silent";
    } else {
      rawEl.textContent = "no Arduino";
    }
    const cpuEl = document.getElementById("cpu");
    if (cpuEl) {
      cpuEl.textContent = s.cpu_temp == null
        ? "CPU -- °C"
        : ("CPU " + Number(s.cpu_temp).toFixed(1) + " °C");
    }
    const cam = document.getElementById("cam");
    const snapLabel = document.getElementById("snapLabel");
    if (!KIOSK && s.snapshot_at) {
      const at = String(s.snapshot_at);
      if (cam && cam.dataset.at !== at) {
        cam.dataset.at = at;
        cam.src = "/snapshot?t=" + encodeURIComponent(at);
      }
      if (snapLabel) {
        const d = new Date(Number(s.snapshot_at) * 1000);
        snapLabel.textContent = "Snapshot " + d.toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit",
        });
      }
    } else if (!KIOSK && snapLabel) {
      snapLabel.textContent = s.camera == null ? "No camera" : "Snapshot";
    }
  } catch (err) {
    document.getElementById("raw").textContent = "status error";
  }
}
async function calibrate(kind) {
  const res = await fetch("/calibrate/" + kind, { method: "POST" });
  const s = await res.json();
  const rawEl = document.getElementById("raw");
  if (!s.ok) {
    rawEl.textContent = s.error || "calibrate failed";
    return;
  }
  rawEl.textContent = kind + " = " + s.raw;
  refresh();
}
if (!KIOSK) {
  document.getElementById("water").onclick = () => fetch("/water", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ source: "home" }),
  });
  document.getElementById("lamp").onclick = () => fetch("/light", { method: "POST" });
  document.querySelectorAll("#plants [data-plant]").forEach((b) => {
    b.onclick = async () => {
      const id = b.getAttribute("data-plant");
      const p = PLANTS[id];
      if (p) markPlant(id, p.low, p.high, p.label);
      const rawEl = document.getElementById("raw");
      try {
        const res = await fetch("/plant/" + id, { method: "POST" });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.ok) {
          rawEl.textContent = "Restart the station to save plant type: sudo systemctl restart canopy-station";
          return;
        }
        markPlant(body.plant_id, body.low, body.high, body.profile);
      } catch (err) {
        rawEl.textContent = "Restart the station to save plant type";
        return;
      }
      refresh();
    };
  });
  const powerBtn = document.getElementById("power");
  let powerArmed = 0;
  powerBtn.onclick = async () => {
    const now = Date.now();
    if (now - powerArmed > 5000) {
      powerArmed = now;
      powerBtn.textContent = "Tap again to shut down";
      powerBtn.classList.add("armed");
      setTimeout(() => {
        if (Date.now() - powerArmed >= 4900 && !powerBtn.disabled) {
          powerBtn.textContent = "Shut down";
          powerBtn.classList.remove("armed");
          powerArmed = 0;
        }
      }, 5000);
      return;
    }
    powerBtn.disabled = true;
    powerBtn.textContent = "Shutting down…";
    try {
      const res = await fetch("/poweroff", { method: "POST" });
      const s = await res.json();
      if (!s.ok) {
        powerBtn.disabled = false;
        powerBtn.classList.remove("armed");
        powerBtn.textContent = s.error || "Shut down failed";
        powerArmed = 0;
      }
    } catch (err) {
      powerBtn.disabled = false;
      powerBtn.classList.remove("armed");
      powerBtn.textContent = "Shut down failed";
      powerArmed = 0;
    }
  };
}
meter(document.getElementById("m-moist"), "Moisture", 0, 40, 70, false);
meter(document.getElementById("m-light"), "Light", 0, 40, null, false);
meter(document.getElementById("m-green"), "Green", 0, null, null, true);
meter(document.getElementById("m-yellow"), "Yellow", 0, null, 15, true);
tickClock();
refresh();
setInterval(tickClock, 1000);
setInterval(refresh, 1500);
if (KIOSK) {
  function polyPath(pts) {
    if (!pts.length) return "";
    return pts.map((s, i) => (i ? "L " : "M ") + s.split(",").map((n) => Number(n).toFixed(1)).join(" ")).join(" ");
  }
  function smoothPath(pts) {
    if (!pts.length) return "";
    if (pts.length === 1) return "M " + pts[0];
    if (pts.length === 2) return "M " + pts[0] + " L " + pts[1];
    const xy = pts.map((s) => s.split(",").map(Number));
    let d = "M " + xy[0][0].toFixed(1) + " " + xy[0][1].toFixed(1);
    for (let i = 0; i < xy.length - 1; i++) {
      const p0 = xy[i - 1] || xy[i];
      const p1 = xy[i];
      const p2 = xy[i + 1];
      const p3 = xy[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6;
      const c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6;
      const c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += " C " + c1x.toFixed(1) + " " + c1y.toFixed(1) + " " + c2x.toFixed(1) + " " + c2y.toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
    }
    return d;
  }
  function monotonePath(pts) {
    if (!pts.length) return "";
    const xy = pts.map((s) => s.split(",").map(Number));
    const n = xy.length;
    if (n === 1) return "M " + xy[0][0].toFixed(1) + " " + xy[0][1].toFixed(1);
    if (n === 2) return "M " + xy[0][0].toFixed(1) + " " + xy[0][1].toFixed(1) + " L " + xy[1][0].toFixed(1) + " " + xy[1][1].toFixed(1);
    const xs = xy.map((p) => p[0]);
    const ys = xy.map((p) => p[1]);
    const dx = [];
    const m = [];
    for (let i = 0; i < n - 1; i++) {
      dx[i] = xs[i + 1] - xs[i];
      m[i] = dx[i] === 0 ? 0 : (ys[i + 1] - ys[i]) / dx[i];
    }
    const t = new Array(n);
    t[0] = m[0];
    t[n - 1] = m[n - 2];
    for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
    for (let i = 0; i < n - 1; i++) {
      if (m[i] === 0) { t[i] = 0; t[i + 1] = 0; continue; }
      const a = t[i] / m[i];
      const b = t[i + 1] / m[i];
      const s = a * a + b * b;
      if (s > 9) {
        const q = 3 / Math.sqrt(s);
        t[i] = q * a * m[i];
        t[i + 1] = q * b * m[i];
      }
    }
    let d = "M " + xs[0].toFixed(1) + " " + ys[0].toFixed(1);
    for (let i = 0; i < n - 1; i++) {
      const c1x = xs[i] + dx[i] / 3;
      const c1y = ys[i] + (t[i] * dx[i]) / 3;
      const c2x = xs[i + 1] - dx[i] / 3;
      const c2y = ys[i + 1] - (t[i + 1] * dx[i]) / 3;
      d += " C " + c1x.toFixed(1) + " " + c1y.toFixed(1) + " " + c2x.toFixed(1) + " " + c2y.toFixed(1) + " " + xs[i + 1].toFixed(1) + " " + ys[i + 1].toFixed(1);
    }
    return d;
  }
  function axisClock(ms, isEnd) {
    if (isEnd) return "24:00";
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Los_Angeles", hourCycle: "h23", hour: "2-digit", minute: "2-digit",
    }).formatToParts(new Date(ms));
    const h = parts.find((p) => p.type === "hour")?.value ?? "00";
    const m = parts.find((p) => p.type === "minute")?.value ?? "00";
    return String(Number(h) % 24) + ":" + m;
  }
  function weekTick(ms) {
    return new Date(ms).toLocaleDateString("en-US", { timeZone: "America/Los_Angeles", weekday: "short" });
  }
  function drawHdmiLight(data) {
    const svg = document.getElementById("hdmiLight");
    if (!svg || !data) return;
    const pad = { l: 36, r: 14, t: 18, b: 24 };
    const W = 720, H = 320, iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const start = data.window.startMs, end = data.window.endMs;
    const span = Math.max(1, end - start);
    const target = data.target || 6;
    const ymax = Math.max(target, data.accumulated || 0) * 1.08;
    const x = (t) => pad.l + ((t - start) / span) * iw;
    const y = (v) => pad.t + ih - (v / Math.max(0.01, ymax)) * ih;
    const exp = data.expected || [];
    const act = (data.actual || []).filter((p) => p.t <= data.now);
    const last = act[act.length - 1];
    const nowT = Math.min(Math.max(data.now, start), end);
    const expPts = exp.map((p) => x(p.t).toFixed(1) + "," + y(p.v).toFixed(1));
    const actPts = act.map((p) => x(p.t).toFixed(1) + "," + y(p.v).toFixed(1));
    let gap = "";
    if (last && exp.length && act.length > 1) {
      const upto = exp.filter((p) => p.t <= last.t);
      const fwd = upto.map((p) => x(p.t).toFixed(1) + "," + y(p.v).toFixed(1));
      const back = act.slice().reverse().map((p) => x(p.t).toFixed(1) + "," + y(p.v).toFixed(1));
      gap = fwd.join(" ") + " " + back.join(" ");
    }
    const behind = data.delta <= -0.3;
    const ticks = [0, .25, .5, .75, 1].map((f) => start + f * span);
    const parts = [];
    ticks.forEach((t, i) => {
      parts.push(`<text x="${x(t)}" y="${H - 6}" text-anchor="middle" fill="#8a9386" font-size="12" font-family="ui-monospace,monospace">${axisClock(t, i === ticks.length - 1)}</text>`);
    });
    if (gap) parts.push(`<polygon points="${gap}" fill="${behind ? "#c47a6a" : "#8fba8a"}" opacity="0.22"/>`);
    if (expPts.length) parts.push(`<path d="${smoothPath(expPts)}" fill="none" stroke="#8a9386" stroke-width="1.5" stroke-dasharray="5 5"/>`);
    if (actPts.length) parts.push(`<path d="${monotonePath(actPts)}" fill="none" stroke="#c4a574" stroke-width="2.6" stroke-linejoin="round"/>`);
    parts.push(`<line x1="${x(nowT)}" x2="${x(nowT)}" y1="${pad.t}" y2="${pad.t + ih}" stroke="#e8eee6" stroke-width="1" opacity="0.4"/>`);
    if (last) parts.push(`<circle cx="${x(last.t)}" cy="${y(last.v)}" r="4.5" fill="#c4a574"/>`);
    svg.innerHTML = parts.join("");
    const numEl = document.getElementById("hdmiLightNum");
    if (numEl) numEl.innerHTML = Number(data.accumulated || 0).toFixed(1) + "<span>sun-h</span>";
    const why = document.getElementById("hdmiLightWhy");
    if (why) {
      why.textContent = data.statusLine || "";
      why.className = "hdmi-why" + (behind ? " behind" : "");
    }
  }
  function drawHdmiMoist(data) {
    const svg = document.getElementById("hdmiMoist");
    if (!svg || !data) return;
    const pad = { l: 36, r: 14, t: 18, b: 24 };
    const W = 720, H = 320, iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    const start = data.window.startMs, end = data.window.endMs;
    const span = Math.max(1, end - start);
    const ymax = 100;
    const x = (t) => pad.l + ((t - start) / span) * iw;
    const y = (v) => pad.t + ih - (v / ymax) * ih;
    const samples = (data.samples || []).filter((p) => p.t <= data.now && p.pump_event !== "start");
    const pumps = (data.samples || []).filter((p) => p.pump_event === "start" && p.t <= data.now);
    const last = samples[samples.length - 1];
    const nowT = Math.min(Math.max(data.now, start), end);
    const actPts = samples.map((p) => x(p.t).toFixed(1) + "," + y(p.v).toFixed(1));
    const under = last && samples.length
      ? x(samples[0].t).toFixed(1) + "," + y(0).toFixed(1) + " " + actPts.join(" ") + " " + x(last.t).toFixed(1) + "," + y(0).toFixed(1)
      : "";
    const ticks = [];
    for (let t = start; t <= end + 60000; t += 24 * 3600 * 1000) ticks.push(Math.min(t, end));
    const parts = [];
    ticks.forEach((t) => {
      parts.push(`<text x="${x(t)}" y="${H - 6}" text-anchor="middle" fill="#8a9386" font-size="12" font-family="ui-monospace,monospace">${weekTick(t)}</text>`);
    });
    if (under) parts.push(`<polygon points="${under}" fill="#9cba8b" opacity="0.1"/>`);
    parts.push(`<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(data.threshold || 40)}" y2="${y(data.threshold || 40)}" stroke="#8a9386" stroke-width="1.5" stroke-dasharray="5 5"/>`);
    if (actPts.length) parts.push(`<path d="${polyPath(actPts)}" fill="none" stroke="#9cba8b" stroke-width="2.4" stroke-linejoin="round"/>`);
    pumps.forEach((p) => {
      parts.push(`<line x1="${x(p.t)}" x2="${x(p.t)}" y1="${y(0)}" y2="${y(p.v)}" stroke="#c4a574" stroke-width="1" opacity="0.55"/>`);
      parts.push(`<circle cx="${x(p.t)}" cy="${y(p.v)}" r="3.5" fill="#c4a574"/>`);
    });
    parts.push(`<line x1="${x(nowT)}" x2="${x(nowT)}" y1="${pad.t}" y2="${pad.t + ih}" stroke="#e8eee6" stroke-width="1" opacity="0.4"/>`);
    svg.innerHTML = parts.join("");
    const numEl = document.getElementById("hdmiMoistNum");
    if (numEl) numEl.innerHTML = Number(data.current || 0).toFixed(1) + "<span>%</span>";
    const why = document.getElementById("hdmiMoistWhy");
    if (why) {
      const below = data.current < (data.threshold || 40) - 0.3;
      why.textContent = data.pump ? "Pump on" : (below ? "below target" : "In range");
      why.className = "hdmi-why" + (below ? " behind" : "");
    }
  }
  async function loadHdmiCharts() {
    try {
      const [lightRes, moistRes] = await Promise.all([
        fetch("/api/light/today", { cache: "no-store" }),
        fetch("/api/moisture/week", { cache: "no-store" }),
      ]);
      drawHdmiLight(await lightRes.json());
      drawHdmiMoist(await moistRes.json());
    } catch (err) { /* keep last frame */ }
  }
  loadHdmiCharts();
  setInterval(loadHdmiCharts, 5000);
}
</script>
