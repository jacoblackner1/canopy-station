<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Canopy</title>
<style>
  :root {
    --bg: #0c0f0c; --surface: #151a15; --surface-2: #1c231c;
    --fg: #e8eee6; --muted: #8a9386; --subtle: #5e675b;
    --primary: #9cba8b; --primary-fg: #0c0f0c;
    --warn: #c4a574; --alert: #c47a6a; --ok: #8fba8a;
    --side: clamp(16rem, 34vw, 26rem);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  body.kiosk { overflow: hidden; }
  .stage {
    display: flex; flex-direction: column;
    width: 100%; height: 100dvh; min-height: 100%;
    background: var(--bg);
  }
  header {
    height: clamp(2rem, 6vh, 3rem);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 1rem 0 1.1rem; background: var(--surface); flex-shrink: 0;
  }
  header .brand { font-family: Georgia, "Times New Roman", serif; font-size: clamp(14px, 2.4vh, 20px); margin: 0; }
  header .clock { font-family: ui-monospace, monospace; font-size: clamp(12px, 2vh, 16px); color: var(--muted); }
  header .hint { font-size: 12px; color: var(--subtle); margin: 0 12px 0 auto; }
  .body { display: flex; flex: 1; min-height: 0; }
  .cam { position: relative; flex: 1; min-width: 0; background: var(--surface-2); }
  .cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cam .scrim {
    pointer-events: none; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(12,15,12,.72), transparent 42%);
  }
  .badge {
    position: absolute; top: clamp(8px, 1.4vh, 14px); left: clamp(8px, 1.4vh, 14px);
    display: flex; align-items: center; gap: 6px;
    background: rgba(12,15,12,.7); color: var(--fg);
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 6px;
  }
  .dot { width: 6px; height: 6px; border-radius: 99px; background: var(--alert); }
  .flag {
    position: absolute; top: clamp(8px, 1.4vh, 14px); right: clamp(8px, 1.4vh, 14px);
    font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 6px;
  }
  .flag.pulse { background: var(--primary); color: var(--primary-fg); }
  .flag.lamp { background: var(--warn); color: #1a140c; }
  .plant {
    position: absolute; left: clamp(8px, 1.6vh, 16px); bottom: clamp(8px, 1.6vh, 16px);
    font-family: Georgia, serif; font-size: clamp(18px, 3.4vh, 32px); margin: 0; line-height: 1.15;
  }
  aside {
    width: var(--side); flex-shrink: 0; background: var(--surface);
    display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 16px);
    padding: clamp(10px, 2vh, 20px) clamp(12px, 1.6vw, 20px);
  }
  .k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .status { font-family: Georgia, serif; font-size: clamp(18px, 3.6vh, 36px); line-height: 1.15; margin: 0; }
  .status.ok { color: var(--ok); }
  .status.warn { color: var(--warn); }
  .status.alert { color: var(--alert); }
  .sub { font-size: clamp(12px, 1.8vh, 15px); color: var(--muted); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter .row { display: flex; justify-content: space-between; gap: 8px; font-size: clamp(11px, 1.7vh, 14px); }
  .meter .lab { letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .meter .val { font-family: ui-monospace, monospace; }
  .meter .val.warn { color: var(--warn); }
  .bar { position: relative; height: clamp(4px, 0.7vh, 8px); border-radius: 99px; background: var(--surface-2); margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
  .bar.warn > i { background: var(--warn); }
  .bar .m { position: absolute; top: 0; width: 1px; height: 100%; background: rgba(232,238,230,.4); }
  .actions { margin-top: auto; display: flex; flex-direction: column; gap: 10px; width: 100%; }
  body.kiosk .controls { display: none !important; }
  body.kiosk header .hint { display: none; }
  .controls { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  button {
    width: 100%;
    min-height: 48px; border: 0; border-radius: 999px; cursor: pointer;
    font: 500 16px "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  button svg { width: 20px; height: 20px; flex-shrink: 0; }
  button:disabled { opacity: .4; cursor: default; }
  .go { background: var(--primary); color: var(--primary-fg); }
  .ghost {
    background: transparent; color: var(--fg);
    box-shadow: 0 0 0 1px rgba(232,238,230,.14);
  }
  .next { text-align: center; font-family: ui-monospace, monospace; font-size: clamp(11px, 1.8vh, 14px); color: var(--muted); margin: 0; }
  .raw { text-align: center; font-family: ui-monospace, monospace; font-size: 11px; color: var(--subtle); margin: 0; word-break: break-word; }
  .cpu {
    text-align: center; font-family: ui-monospace, monospace;
    font-size: 10px; color: var(--subtle); margin: 2px 0 0; letter-spacing: .02em;
  }
  .cal { display: flex; gap: 8px; }
  .cal button {
    flex: 1; min-height: 44px; font-size: 13px; border-radius: 999px;
    background: transparent; color: var(--muted);
    box-shadow: 0 0 0 1px rgba(232,238,230,.12);
  }
  .power {
    min-height: 40px; font-size: 13px; color: var(--muted);
    background: transparent;
    box-shadow: 0 0 0 1px rgba(232,238,230,.12);
  }
  .power.armed {
    color: #1a100e; background: var(--alert);
    box-shadow: none;
  }
  @media (max-width: 700px) {
    body.full { overflow: auto; }
    body.full .stage { height: auto; min-height: 100dvh; }
    body.full .body { flex-direction: column; }
    body.full .cam { height: 42vh; min-height: 220px; flex: none; }
    body.full aside { width: 100%; }
    body.full header .hint { display: none; }
  }
  @media (max-height: 520px) and (min-width: 701px) {
    aside { gap: 6px; padding: 8px 12px; }
    .cal button, body.full button { min-height: 32px; }
  }
</style>
</head>
<body class="{{MODE}}">
<div class="stage">
  <header>
    <p class="brand">Canopy</p>
    <p class="hint">Controls on this page · HDMI is stats only</p>
    <p class="clock" id="clock">--:--:--</p>
  </header>
  <div class="body">
    <div class="cam">
      <img src="/video" alt="Station camera"/>
      <div class="scrim"></div>
      <div class="badge"><span class="dot"></span> Live</div>
      <div class="flag pulse" id="pulse" hidden>Pulse</div>
      <div class="flag lamp" id="lampFlag" hidden>Lamp</div>
      <p class="plant" id="plant">—</p>
    </div>
    <aside>
      <div>
        <p class="k">Status</p>
        <p class="status ok" id="status">Waiting</p>
        <p class="sub" id="profile">—</p>
      </div>
      <div class="meter" id="m-moist"></div>
      <div class="meter" id="m-light"></div>
      <div class="meter" id="m-green"></div>
      <div class="meter" id="m-yellow"></div>
      <div class="actions">
        <div class="controls">
          <button class="go" id="water" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a7 7 0 0 0 7-7c0-4-7-11-7-11S5 11 5 15a7 7 0 0 0 7 7z"/></svg>
            <span>Water 1s</span>
          </button>
          <button class="ghost" id="lamp" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <span id="lampLabel">Lamp on</span>
          </button>
        </div>
        <p class="next" id="next">Auto --:--</p>
        <p class="raw" id="raw">sensors —</p>
        <div class="cal controls">
          <button type="button" id="setAir">Set air</button>
          <button type="button" id="setWater">Set water</button>
        </div>
        <div class="controls">
          <button class="power" id="power" type="button">Shut down</button>
        </div>
        <p class="cpu" id="cpu"></p>
      </div>
    </aside>
  </div>
</div>
<script>
const KIOSK = document.body.classList.contains("kiosk");
function num(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}
function meter(el, label, value, low, high, ready) {
  if (!el) return;
  if (!ready) {
    el.innerHTML = `<div class="row"><span class="lab">${label}</span>
      <span class="val">—</span></div>
      <div class="bar"><i style="width:2%"></i></div>`;
    return;
  }
  const n = num(value);
  const lo = low == null ? null : num(low);
  const hi = high == null ? null : num(high);
  const warn = (lo != null && n < lo) || (hi != null && n > hi);
  const marks = (lo != null ? `<span class="m" style="left:${lo}%"></span>` : "")
    + (hi != null ? `<span class="m" style="left:${hi}%"></span>` : "");
  el.innerHTML = `<div class="row"><span class="lab">${label}</span>
    <span class="val ${warn ? "warn" : ""}">${n.toFixed(1)}%</span></div>
    <div class="bar ${warn ? "warn" : ""}"><i style="width:${Math.max(2, Math.min(100, n))}%"></i>${marks}</div>`;
}
function tickClock() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString();
}
async function refresh() {
  try {
    const res = await fetch("/status", { cache: "no-store" });
    const s = await res.json();
    const ready = !!s.sensors_ok;
    document.getElementById("status").textContent = s.status || "Waiting";
    document.getElementById("status").className = "status " + (s.status_tone || "muted");
    document.getElementById("profile").textContent = s.profile || "—";
    document.getElementById("plant").textContent = s.profile || "—";
    meter(document.getElementById("m-moist"), "Moisture", s.moisture, s.low, s.high, ready);
    meter(document.getElementById("m-light"), "Light", s.light, 40, null, ready);
    meter(document.getElementById("m-green"), "Green", num(s.green) * 100, 25, null, true);
    meter(document.getElementById("m-yellow"), "Yellow", num(s.yellow) * 100, null, 15, true);
    document.getElementById("pulse").hidden = !s.pump;
    document.getElementById("lampFlag").hidden = !s.lamp || s.pump;
    const lampBtn = document.getElementById("lamp");
    const lampLabel = document.getElementById("lampLabel");
    if (lampBtn && lampLabel) {
      lampLabel.textContent = s.lamp ? "Lamp off" : "Lamp on";
      lampBtn.className = s.lamp ? "go" : "ghost";
    }
    const waterBtn = document.getElementById("water");
    if (waterBtn) waterBtn.disabled = !!s.pump;
    const remain = Math.max(0, Math.floor(num(s.auto_in)));
    const mm = Math.floor(remain / 60);
    const ss = String(remain % 60).padStart(2, "0");
    document.getElementById("next").textContent = "Auto " + mm + ":" + ss;
    const rawEl = document.getElementById("raw");
    if (ready) {
      let t = "raw " + s.moisture_raw + " / " + s.light_raw;
      if (!KIOSK) t += "  dry " + s.moisture_dry + " wet " + s.moisture_wet;
      if (s.lamp && num(s.lamp_delta)) {
        t += "  lamp " + (s.lamp_delta > 0 ? "−" : "+") + Math.abs(num(s.lamp_delta));
      }
      rawEl.textContent = t;
    } else if (s.last_line) {
      rawEl.textContent = "saw: " + s.last_line;
    } else if (s.serial) {
      rawEl.textContent = "Arduino silent";
    } else {
      rawEl.textContent = "no Arduino";
    }
    const cpuEl = document.getElementById("cpu");
    if (cpuEl) {
      cpuEl.textContent = s.cpu_temp == null ? "" : ("CPU " + Number(s.cpu_temp).toFixed(1) + " °C");
    }
  } catch (err) {
    document.getElementById("raw").textContent = "status error";
  }
}
async function calibrate(kind) {
  const res = await fetch("/calibrate/" + kind, { method: "POST" });
  const s = await res.json();
  const rawEl = document.getElementById("raw");
  if (!s.ok) {
    rawEl.textContent = s.error || "calibrate failed";
    return;
  }
  rawEl.textContent = kind + " = " + s.raw;
  refresh();
}
if (!KIOSK) {
  document.getElementById("water").onclick = () => fetch("/water", { method: "POST" });
  document.getElementById("lamp").onclick = () => fetch("/light", { method: "POST" });
  document.getElementById("setAir").onclick = () => calibrate("air");
  document.getElementById("setWater").onclick = () => calibrate("water");
  const powerBtn = document.getElementById("power");
  let powerArmed = 0;
  powerBtn.onclick = async () => {
    const now = Date.now();
    if (now - powerArmed > 5000) {
      powerArmed = now;
      powerBtn.textContent = "Tap again to shut down";
      powerBtn.classList.add("armed");
      setTimeout(() => {
        if (Date.now() - powerArmed >= 4900 && !powerBtn.disabled) {
          powerBtn.textContent = "Shut down";
          powerBtn.classList.remove("armed");
          powerArmed = 0;
        }
      }, 5000);
      return;
    }
    powerBtn.disabled = true;
    powerBtn.textContent = "Shutting down…";
    try {
      const res = await fetch("/poweroff", { method: "POST" });
      const s = await res.json();
      if (!s.ok) {
        powerBtn.disabled = false;
        powerBtn.classList.remove("armed");
        powerBtn.textContent = s.error || "Shut down failed";
        powerArmed = 0;
      }
    } catch (err) {
      powerBtn.disabled = false;
      powerBtn.classList.remove("armed");
      powerBtn.textContent = "Shut down failed";
      powerArmed = 0;
    }
  };
}
meter(document.getElementById("m-moist"), "Moisture", 0, 40, 70, false);
meter(document.getElementById("m-light"), "Light", 0, 40, null, false);
meter(document.getElementById("m-green"), "Green", 0, 25, null, true);
meter(document.getElementById("m-yellow"), "Yellow", 0, null, 15, true);
tickClock();
refresh();
setInterval(tickClock, 1000);
setInterval(refresh, 1500);
</script>
</body>
</html>
