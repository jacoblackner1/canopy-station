<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Today's light · Canopy</title>
<style>
  :root {
    --bg: #0c0f0c; --surface: #151a15; --surface-2: #1c231c;
    --fg: #e8eee6; --muted: #8a9386; --subtle: #5e675b;
    --primary: #9cba8b; --primary-fg: #0c0f0c;
    --warn: #c4a574; --alert: #c47a6a; --ok: #8fba8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; min-height: 44px;
  }
  a.back {
    color: var(--muted); text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 44px; padding: 0 8px; border-radius: 8px;
  }
  a.back:hover { color: var(--fg); background: var(--surface-2); }
  main { padding: 8px 16px 24px; max-width: 56rem; margin: 0 auto; }
  .card {
    background: var(--surface); border-radius: 20px;
    padding: 24px 24px 28px;
    box-shadow: 0 0 0 1px rgba(232,238,230,.08);
  }
  .k { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .num { font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.8rem, 9vw, 3.75rem); margin: 6px 0 0; letter-spacing: -0.03em; line-height: 1; }
  .num span { font-family: "Segoe UI", system-ui, sans-serif; font-size: 1rem; color: var(--muted); margin-left: 8px; font-style: normal; }
  .line { margin: 12px 0 0; font-size: 15px; }
  .line.behind { color: var(--alert); }
  .line.ahead { color: var(--ok); }
  svg { width: 100%; height: auto; display: block; margin-top: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .sw { display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .sw.exp { border-top: 1.5px dashed var(--muted); height: 0; }
  .sw.act { background: var(--warn); }
  .sw.gap { width: 8px; height: 8px; border-radius: 2px; }
  .foot {
    margin-top: 16px;
    font-family: ui-monospace, monospace;
    font-size: 12px; color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline;
  }
  .foot b { font-weight: 500; color: var(--fg); }
  .foot .behind { color: var(--alert); }
  .foot .ahead { color: var(--ok); }
  .modes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 24px; }
  .modes button {
    min-height: 44px; border: 0; border-radius: 999px; cursor: pointer;
    font: 500 14px "Segoe UI", system-ui, sans-serif;
    background: transparent; color: var(--muted);
    box-shadow: 0 0 0 1px rgba(232,238,230,.14);
  }
  .modes button.on { background: var(--primary); color: var(--primary-fg); box-shadow: none; }
  .tip {
    position: absolute; pointer-events: none;
    background: var(--surface-2); color: var(--fg);
    font-family: ui-monospace, monospace; font-size: 12px;
    padding: 6px 8px; border-radius: 8px;
    box-shadow: 0 0 0 1px rgba(232,238,230,.12);
  }
  .chart-wrap { position: relative; }
</style>
</head>
<body>
<header>
  <a class="back" href="/">← Back</a>
  <p style="margin:0;font-family:Georgia,serif">Canopy</p>
</header>
<main>
  <section class="card">
    <p class="k">Today's light</p>
    <p class="num" id="acc">—<span>sun-h</span></p>
    <p class="line" id="status">—</p>
    <div class="chart-wrap">
      <svg id="chart" viewBox="0 0 720 320" role="img" aria-label="Cumulative light today"></svg>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="legend">
      <span><i class="sw exp"></i>Expected</span>
      <span><i class="sw act"></i>Actual</span>
      <span><i class="sw gap" id="gapSw"></i><span id="gapLab">Behind</span></span>
    </div>
    <p class="foot" id="foot">—</p>
    <div class="modes">
      <button type="button" data-mode="auto">Auto</button>
      <button type="button" data-mode="on">Force on</button>
      <button type="button" data-mode="off">Force off</button>
    </div>
  </section>
</main>
<script>
function fmt(n) { return Number(n).toFixed(1); }
function clock(ms) {
  return new Date(ms).toLocaleTimeString("en-US", {
    timeZone: "America/Los_Angeles",
    hour: "numeric",
    minute: "2-digit",
  });
}
function axisClock(ms, isEnd) {
  if (isEnd) return "24:00";
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Los_Angeles",
    hourCycle: "h23",
    hour: "2-digit",
    minute: "2-digit",
  }).formatToParts(new Date(ms));
  const h = parts.find((p) => p.type === "hour")?.value ?? "00";
  const m = parts.find((p) => p.type === "minute")?.value ?? "00";
  return String(Number(h) % 24) + ":" + m;
}
function smoothPath(pts) {
  if (!pts.length) return "";
  if (pts.length === 1) return "M " + pts[0];
  if (pts.length === 2) return "M " + pts[0] + " L " + pts[1];
  const xy = pts.map((s) => s.split(",").map(Number));
  let d = "M " + xy[0][0].toFixed(1) + " " + xy[0][1].toFixed(1);
  for (let i = 0; i < xy.length - 1; i++) {
    const p0 = xy[i - 1] || xy[i];
    const p1 = xy[i];
    const p2 = xy[i + 1];
    const p3 = xy[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += " C " + c1x.toFixed(1) + " " + c1y.toFixed(1) + " " + c2x.toFixed(1) + " " + c2y.toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
  }
  return d;
}
function draw(data) {
  const svg = document.getElementById("chart");
  const pad = { l: 36, r: 18, t: 22, b: 28 };
  const W = 720, H = 320, iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const start = data.window.startMs, end = data.window.endMs;
  const span = Math.max(1, end - start);
  const target = data.target || 6;
  const ymax = Math.max(target, data.accumulated || 0) * 1.08;
  const x = (t) => pad.l + ((t - start) / span) * iw;
  const y = (v) => pad.t + ih - (v / Math.max(0.01, ymax)) * ih;
  const exp = data.expected || [];
  const act = (data.actual || []).filter((p) => p.t <= data.now);
  const last = act[act.length - 1];
  const nowT = Math.min(Math.max(data.now, start), end);
  const expPts = exp.map((p) => x(p.t).toFixed(1) + "," + y(p.v).toFixed(1));
  const actPts = act.map((p) => x(p.t).toFixed(1) + "," + y(p.v).toFixed(1));
  const under = last && act.length
    ? x(act[0].t).toFixed(1) + "," + y(0).toFixed(1) + " " + actPts.join(" ") + " " + x(last.t).toFixed(1) + "," + y(0).toFixed(1)
    : "";
  let gap = "";
  if (last && exp.length && act.length > 1) {
    const upto = exp.filter((p) => p.t <= last.t);
    const fwd = upto.map((p) => x(p.t).toFixed(1) + "," + y(p.v).toFixed(1));
    const back = act.slice().reverse().map((p) => x(p.t).toFixed(1) + "," + y(p.v).toFixed(1));
    gap = fwd.join(" ") + " " + back.join(" ");
  }
  const behind = data.delta < -0.03;
  const ticks = [0, .25, .5, .75, 1].map((f) => start + f * span);
  const nowOnRight = (nowT - start) / span > 0.88;
  const parts = [];
  ticks.forEach((t, i) => {
    parts.push(`<text x="${x(t)}" y="${H - 8}" text-anchor="middle" fill="#8a9386" font-size="11" font-family="ui-monospace,monospace">${axisClock(t, i === ticks.length - 1)}</text>`);
  });
  parts.push(`<text x="4" y="${y(target) + 4}" fill="#8a9386" font-size="11" font-family="ui-monospace,monospace">${fmt(target)}</text>`);
  parts.push(`<text x="4" y="${y(0)}" fill="#8a9386" font-size="11" font-family="ui-monospace,monospace">0</text>`);
  if (under) parts.push(`<polygon points="${under}" fill="#c4a574" opacity="0.12"/>`);
  if (gap) parts.push(`<polygon points="${gap}" fill="${behind ? "#c47a6a" : "#8fba8a"}" opacity="0.22"/>`);
  if (expPts.length) parts.push(`<path d="${smoothPath(expPts)}" fill="none" stroke="#8a9386" stroke-width="1.5" stroke-dasharray="5 5" stroke-linejoin="round"/>`);
  if (actPts.length) parts.push(`<path d="${smoothPath(actPts)}" fill="none" stroke="#c4a574" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`);
  parts.push(`<line x1="${x(nowT)}" x2="${x(nowT)}" y1="${pad.t}" y2="${pad.t + ih}" stroke="#e8eee6" stroke-width="1" opacity="0.4"/>`);
  parts.push(`<text x="${x(nowT) + (nowOnRight ? -8 : 6)}" y="${pad.t - 6}" text-anchor="${nowOnRight ? "end" : "start"}" fill="#8a9386" font-size="11" font-family="ui-monospace,monospace">now</text>`);
  if (last) parts.push(`<circle cx="${x(last.t)}" cy="${y(last.v)}" r="4.5" fill="#c4a574"/>`);
  svg.innerHTML = parts.join("");
  svg._map = { start, span, x, pad, iw, W, data };
}
function apply(data) {
  const behind = data.delta < -0.03;
  document.getElementById("acc").innerHTML = fmt(data.accumulated) + "<span>sun-h</span>";
  const mag = fmt(Math.abs(data.delta));
  const lampS = data.lamp ? "lamp ON" : "lamp OFF";
  let line = "On pace · " + lampS;
  if (data.delta < -0.03) line = "−" + mag + " behind expected · " + lampS;
  else if (data.delta > 0.03) line = "+" + mag + " ahead of expected · " + lampS;
  const st = document.getElementById("status");
  st.textContent = line;
  st.className = "line " + (behind ? "behind" : "ahead");
  const lampTxt = data.lamp
    ? (data.lampSince ? ("ON since " + axisClock(data.lampSince)) : "ON")
    : "OFF";
  const win = (data.window.start || "00:00") + "–" + (data.window.end || "24:00");
  document.getElementById("foot").innerHTML =
    "Expected <b>" + fmt(data.expectedNow) + "</b>" +
    " <span>·</span> Actual <b>" + fmt(data.accumulated) + "</b>" +
    " <span>·</span> Delta <b class=\"" + (behind ? "behind" : "ahead") + "\">" +
    (data.delta >= 0 ? "+" : "−") + mag + "</b>" +
    " <span>·</span> Window <b>" + win + "</b>" +
    " <span>·</span> Lamp <b>" + lampTxt + "</b>";
  document.getElementById("gapLab").textContent = behind ? "Behind" : "Ahead";
  document.getElementById("gapSw").style.background = behind ? "var(--alert)" : "var(--ok)";
  document.querySelectorAll(".modes button").forEach((b) => {
    b.classList.toggle("on", b.getAttribute("data-mode") === data.override);
  });
  draw(data);
  window._light = data;
}
async function load() {
  const res = await fetch("/api/light/today", { cache: "no-store" });
  apply(await res.json());
}
document.querySelectorAll(".modes button").forEach((b) => {
  b.onclick = async () => {
    const res = await fetch("/api/light/override", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode: b.getAttribute("data-mode") }),
    });
    apply(await res.json());
  };
});
const svg = document.getElementById("chart");
const tip = document.getElementById("tip");
function tipAt(clientX) {
  const m = svg._map;
  if (!m) return;
  const r = svg.getBoundingClientRect();
  const px = ((clientX - r.left) / r.width) * m.W;
  const t = m.start + ((px - m.pad.l) / m.iw) * m.span;
  const data = window._light;
  if (!data) return;
  const nearest = (arr) => arr.reduce((b, p) => Math.abs(p.t - t) < Math.abs(b.t - t) ? p : b);
  const exp = nearest(data.expected);
  const act = data.actual.length ? nearest(data.actual) : { v: 0, lamp: false };
  const d = act.v - exp.v;
  tip.hidden = false;
  tip.style.left = Math.min(70, Math.max(4, ((t - m.start) / m.span) * 100)) + "%";
  tip.style.top = "28px";
  tip.innerHTML = clock(t) + "<br>Exp " + fmt(exp.v) + "<br>Act " + fmt(act.v)
    + "<br>" + (d >= 0 ? "+" : "−") + fmt(Math.abs(d)) + " · " + (act.lamp ? "lamp ON" : "lamp OFF");
}
svg.addEventListener("mousemove", (e) => tipAt(e.clientX));
svg.addEventListener("mouseleave", () => { tip.hidden = true; });
svg.addEventListener("touchstart", (e) => { if (e.touches[0]) tipAt(e.touches[0].clientX); }, { passive: true });
svg.addEventListener("touchmove", (e) => { if (e.touches[0]) tipAt(e.touches[0].clientX); }, { passive: true });
load();
setInterval(load, 5000);
</script>
</body>
</html>
